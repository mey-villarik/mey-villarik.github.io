<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-label="Ilustración de un flujo de automatización con nodos conectados">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2c48d"/>
      <stop offset="1" stop-color="#b08d57"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e2c48d" stop-opacity=".35"/>
      <stop offset="1" stop-color="#e2c48d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="300" cy="260" r="240" fill="url(#glow)"/>
  <circle cx="300" cy="260" r="200" fill="none" stroke="#e2c48d" stroke-opacity=".25" stroke-dasharray="2 8"/>
  <circle cx="300" cy="260" r="150" fill="none" stroke="#e2c48d" stroke-opacity=".18"/>
  <g fill="none" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" class="flow">
    <path d="M110 140 C 200 140, 200 260, 300 260"/>
    <path d="M110 380 C 200 380, 200 260, 300 260"/>
    <path d="M300 260 C 400 260, 400 150, 490 150"/>
    <path d="M300 260 C 400 260, 400 370, 490 370"/>
    <path d="M110 260 L 300 260"/>
  </g>
  <g font-family="Georgia, serif" font-size="15" fill="#f7f1e6" text-anchor="middle">
    <g>
      <rect x="60" y="112" width="100" height="56" rx="12" fill="#24345a" stroke="#e2c48d"/>
      <text x="110" y="145">Webhook</text>
    </g>
    <g>
      <rect x="60" y="232" width="100" height="56" rx="12" fill="#24345a" stroke="#e2c48d"/>
      <text x="110" y="265">CRM</text>
    </g>
    <g>
      <rect x="60" y="352" width="100" height="56" rx="12" fill="#24345a" stroke="#e2c48d"/>
      <text x="110" y="385">Datos</text>
    </g>
    <g>
      <circle cx="300" cy="260" r="62" fill="#1d2a44" stroke="url(#g)" stroke-width="3"/>
      <text x="300" y="255" font-size="22" fill="#e2c48d">IA</text>
      <text x="300" y="278" font-size="12" fill="#f7f1e6" letter-spacing="2">AGENTE</text>
    </g>
    <g>
      <rect x="440" y="122" width="100" height="56" rx="12" fill="#24345a" stroke="#e2c48d"/>
      <text x="490" y="155">Informe</text>
    </g>
    <g>
      <rect x="440" y="342" width="100" height="56" rx="12" fill="#24345a" stroke="#e2c48d"/>
      <text x="490" y="375">Respuesta</text>
    </g>
  </g>
  <g fill="#e2c48d">
    <circle cx="205" cy="200" r="4" class="dot d1"/>
    <circle cx="205" cy="320" r="4" class="dot d2"/>
    <circle cx="395" cy="205" r="4" class="dot d3"/>
    <circle cx="395" cy="315" r="4" class="dot d1"/>
  </g>
  <style>
    .flow path { stroke-dasharray: 6 10; animation: run 2.4s linear infinite; }
    .dot { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .d2 { animation-delay: .8s } .d3 { animation-delay: 1.6s }
    @keyframes run { to { stroke-dashoffset: -64 } }
    @keyframes pulse { 50% { transform: scale(1.8); opacity: .4 } }
    @media (prefers-reduced-motion: reduce) { .flow path, .dot { animation: none } }
  </style>
</svg>
